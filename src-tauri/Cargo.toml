[package]
name = "song-analyzer-tagger"
version = "0.1.0"
edition = "2021"
description = "Song Analyzer & Genre Tagger"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
satcore = { path = "../core" }
tauri-plugin-dialog = "2"
